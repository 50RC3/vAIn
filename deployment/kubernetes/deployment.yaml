apiVersion: apps/v1
kind: Deployment
metadata:
  name: symbolic-reasoning-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: symbolic-reasoning
  template:
    metadata:
      labels:
        app: symbolic-reasoning
    spec:
      containers:
      - name: symbolic-reasoning
        image: your-docker-image/symbolic-reasoning:latest
        resources:
          limits:
            memory: "4Gi"
            cpu: "2000m"
          requests:
            memory: "2Gi"
            cpu: "1000m"
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: MODEL_PATH
          value: "/app/models"
        volumeMounts:
        - name: model-storage
          mountPath: /app/models
        - name: app-config
          mountPath: /app/config
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: model-storage-pvc
      - name: app-config
        configMap:
          name: vain-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: federated-learning-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: federated-learning
  template:
    metadata:
      labels:
        app: federated-learning
    spec:
      volumes:
      - name: app-volume
        emptyDir: {}
      containers:
      - name: federated-learning
        image: your-docker-image/federated-learning:latest
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        volumeMounts:
        - mountPath: /app
          name: app-volume
        command: ["python", "core/federated_learning.py"]
