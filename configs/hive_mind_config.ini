[network]
host = localhost
port = 8080
max_connections = 1000
timeout = 30

[security]
encryption = true
ssl_cert = certs/server.crt
ssl_key = certs/server.key

[federation]
enabled = true
min_nodes = 3
sync_interval = 60

[storage]
type = distributed
replication_factor = 3

[mobile]
min_battery_level = 0.2
min_memory_available = 0.3
min_network_strength = 0.4
update_frequency = 300
batch_size = 32
